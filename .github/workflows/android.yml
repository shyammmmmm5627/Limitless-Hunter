
name: Build Limitless-Hunter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: |
          if [ ! -f gradlew ]; then
            echo "Android project files are not ready yet."
            echo "Add the Gradle wrapper and Android project files before building."
            exit 1
          fi
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Limitless-Hunter-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
